<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Orbis</title>
<style>
  :root { --bg: #07070b; --fg: #ececf1; --muted: #a1a1aa; --border: #26262e; --accent: #8b7cf6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  p { color: var(--muted); margin: 0 0 24px; max-width: 22rem; }
  button { min-height: 48px; min-width: 160px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--border); background: var(--fg); color: var(--bg); font: inherit; font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #status { min-height: 1.5em; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Orbis can't connect</h1>
  <p>Check that you're online, then try again. Your chats and projects are saved on Orbis, so nothing is lost.</p>
  <button type="button" id="retry">Try again</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
  var SITE = "https://tryorbis.app/home";
  var status = document.getElementById("status");
  function retry() {
    status.textContent = "Connecting…";
    location.href = SITE;
  }
  document.getElementById("retry").addEventListener("click", retry);
  // Reconnect by itself when the connection comes back.
  window.addEventListener("online", retry);
</script>
</body>
</html>
